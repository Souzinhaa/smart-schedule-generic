version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: smart_schedule_db
    environment:
      POSTGRES_USER: smart_schedule
      POSTGRES_PASSWORD: smart_schedule
      POSTGRES_DB: smart_schedule
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U smart_schedule' ]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build: .
    container_name: smart_schedule_api
    environment:
      DATABASE_URL: postgresql://smart_schedule:smart_schedule@postgres:5432/smart_schedule
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-https://api.evolution.com}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      DEBUG: ${DEBUG:-False}
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -f http://localhost:8000/health || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
